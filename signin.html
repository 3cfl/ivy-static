<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex, nofollow">
<title>Sign in</title>
<style>
html,body{height:100%;margin:0;background:#000;color:#fff;font:700 15px Montserrat,system-ui,sans-serif}
body{display:flex;align-items:center;justify-content:center;padding:20px;box-sizing:border-box}
main{width:100%;max-width:340px;text-align:center}
h1{font-size:20px;margin:0 0 10px}
p{margin:0 0 18px;color:#a9b5ae;font-size:13px;line-height:1.5;overflow-wrap:anywhere}
b{color:#a7f3d0}
button{width:100%;height:44px;border:0;border-radius:12px;background:#a7f3d0;color:#04140c;font:inherit;cursor:pointer}
button:disabled{opacity:.6}
#note{margin:14px 0 0}
</style>
</head>
<body>
<main>
<div id="title" hidden><h1>Sign in to Ivy</h1><p>Continue only if you opened Ivy yourself. This signs <b id="site"></b> in to your Ivy account.</p></div>
<button id="go" type="button" hidden>Continue with Google</button>
<p id="note"></p>
</main>
<script src="signin.js"></script>
</body>
</html>
